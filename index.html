<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mohammad Elbably | Digital Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a16;--navy:#0c1633;--card:rgba(255,255,255,.045);--line:rgba(212,175,55,.28);--gold:#d4af37;--gold2:#f4dc8f;--txt:#f2efe6;--mut:#a9aec2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a16}}
:root[data-theme="dark"]{--bg:#060a16}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:'Cairo','Segoe UI',Tahoma,sans-serif;display:flex;justify-content:center;
background-image:radial-gradient(520px 340px at 50% -40px,rgba(212,175,55,.16),transparent 70%),radial-gradient(500px 420px at 100% 100%,rgba(30,58,138,.35),transparent 70%),linear-gradient(180deg,#0a1230,#060a16 60%)}
.wrap{width:100%;max-width:440px;padding:34px 20px 28px;text-align:center}
.ring{width:164px;height:164px;margin:0 auto 18px;border-radius:50%;padding:4px;position:relative;background:conic-gradient(from 0deg,var(--gold),#fff6d2,var(--gold),#7a5b12,var(--gold));animation:spin 8s linear infinite;box-shadow:0 0 34px rgba(212,175,55,.45),0 0 90px rgba(212,175,55,.15)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid var(--bg);animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{margin:6px 0 0;color:var(--txt);font-weight:600;font-size:16px}
.org{display:block;margin-top:2px;color:var(--gold2);font-weight:600;font-size:14.5px;letter-spacing:.6px}
.rule{width:64px;height:2px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.bio{margin:0 auto 22px;max-width:330px;color:var(--mut);font-size:14.5px;line-height:1.9}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;text-decoration:none;font-family:inherit;font-weight:700;font-size:15.5px;border-radius:16px;padding:14px 12px;color:var(--txt);background:var(--card);border:1px solid var(--line);backdrop-filter:blur(6px);transition:transform .15s,border-color .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--gold);background:rgba(212,175,55,.08)}
.btn svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{font-size:17px;padding:17px 12px;color:#1a1305;border:0;background:linear-gradient(135deg,#f4dc8f,#d4af37 55%,#b8901f);box-shadow:0 10px 30px rgba(212,175,55,.32);animation:pulse 2.6s ease-in-out infinite}
.main:hover{background:linear-gradient(135deg,#f9e7a8,#e0bb45 55%,#c49a26)}
@keyframes pulse{50%{box-shadow:0 10px 40px rgba(212,175,55,.55)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.full{margin-top:12px}
.wa svg{stroke:#4be08a}
.soc{display:flex;justify-content:center;gap:14px;margin-top:22px}
.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--gold);border:1px solid var(--line);background:var(--card);font-weight:800;font-size:16px;font-family:Arial,sans-serif;transition:.2s}
.soc a:hover{background:var(--gold);color:#1a1305}
.soc svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.num{display:inline-block;margin-top:20px;color:var(--mut);text-decoration:none;font-size:14px;letter-spacing:1px;direction:ltr}
.ft{margin-top:18px;font-size:11.5px;color:#6d7390}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(3,6,14,.78);backdrop-filter:blur(8px)}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:340px;text-align:center;padding:26px 22px 22px;border-radius:24px;background:linear-gradient(180deg,#101c40,#0a1128);border:1px solid var(--gold);box-shadow:0 0 60px rgba(212,175,55,.25)}
.sheet h2{margin:0 0 4px;font-size:19px;color:var(--gold2)}
.sheet p{margin:0 0 16px;font-size:13px;color:var(--mut)}
.qr{background:#fff;border-radius:16px;padding:14px;width:230px;height:230px;margin:0 auto;display:grid;place-items:center;color:#222;font-size:12px;word-break:break-all}
.qr svg{width:100%;height:100%;display:block}
.close{margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:30;background:#16213f;color:var(--txt);border:1px solid var(--gold);padding:11px 18px;border-radius:30px;font-size:14px;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
